spring:
  application:
    name: security-template

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Mail Configuration (defaults - overridden in profile-specific files)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp
    default-encoding: UTF-8

# ===========================
# Configuración de OTP para email verification
# ===========================
otp:
  length: 6
  expiration-minutes: 5
  max-attempts: 5
  resend-cooldown-seconds: 60

# ===========================
# Configuración de Seguridad
# ===========================
security:
  authorization-mode: groups  # AUTHORITIES o GROUPS

# ===========================
# Configuración JWT
# ===========================
jwt:
  secret:
    key: ${JWT_SECRET:your-very-secure-secret-key-min-256-bits-long-change-this-in-production}
  issuer: ${JWT_ISSUER:Security-Template-App}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION_MS:900000}    # 20 segundos
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 días
