spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  sql:
    init:
      mode: never  # No ejecutar scripts en producción

logging:
  level:
    org.springframework.security: INFO
    com.yourproject: INFO

# JWT en producción debe usar variables de entorno
jwt:
  secret:
    key: ${JWT_SECRET}  # ¡OBLIGATORIO en producción!